<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuraNovaTD WMS Ultra Secured v6</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 font-sans p-4">

    <div id="login-screen" class="fixed inset-0 bg-gray-900 flex flex-col justify-center items-center z-50 px-4">
        <div class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-sm">
            <div class="text-center mb-4">
                <span class="text-4xl">🔐</span>
                <h2 class="text-xl font-bold text-gray-800 mt-2 mb-1">AuraNovaTD WMS</h2>
                <p class="text-xs text-gray-500">Σύνδεση στο κλειδωμένο σύστημα</p>
            </div>
            
            <div class="space-y-3">
                <div>
                    <label class="text-xs font-semibold text-gray-600">Email</label>
                    <input type="email" id="email-input" placeholder="name@example.com" 
                           class="w-full p-3 border border-gray-200 rounded-xl focus:border-blue-500 focus:outline-none text-sm mt-1">
                </div>
                <div>
                    <label class="text-xs font-semibold text-gray-600">Password</label>
                    <input type="password" id="password-input" placeholder="••••••••" 
                           class="w-full p-3 border border-gray-200 rounded-xl focus:border-blue-500 focus:outline-none text-sm mt-1">
                </div>
            </div>
            
            <button onclick="window.loginWithFirebase()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition-colors mt-6 text-sm">
                Είσοδος στην Αποθήκη
            </button>
            <p id="login-error" class="text-red-500 text-xs mt-3 hidden text-center font-semibold"></p>
        </div>
    </div>

    <div id="main-app" class="hidden">
        <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6 mb-6">
            <div class="flex justify-between items-center mb-2">
                <h1 class="text-2xl font-bold text-gray-800">📦 AuraNovaTD WMS</h1>
                <button onclick="window.logoutWithFirebase()" class="text-xs bg-red-50 text-red-600 px-3 py-1.5 rounded-lg hover:bg-red-100 font-bold transition-colors">Έξοδος</button>
            </div>
            <p class="text-xs text-blue-500 font-semibold mb-4">Secured Supply Chain System</p>
            
            <div id="alerts-container" class="hidden mb-4 p-3 bg-red-50 border border-red-200 rounded-lg text-xs text-red-700">
                <span class="font-bold">⚠️ ΠΡΟΣΟΧΗ - ΧΑΜΗΛΟ ΣΤΟΚ:</span>
                <ul id="alerts-list" class="list-disc list-inside mt-1"></ul>
            </div>

            <div id="inventory-container" class="space-y-6">
                <p class="text-center text-gray-600">Φόρτωση εξελιγμένης αποθήκης...</p>
            </div>
        </div>

        <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6">
            <h2 class="text-lg font-bold text-gray-800 mb-3 flex justify-between items-center">
                <span>📜 Ιστορικό Κινήσεων (Live Log)</span>
                <span class="text-xs font-normal text-gray-500">Τελευταίες 5 κινήσεις</span>
            </h2>
            <div id="transactions-container" class="space-y-2 text-xs">
                <p class="text-gray-500 italic">Φόρτωση ιστορικού...</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, collection, addDoc, query, orderBy, limit, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // Τα κλειδιά σου
        const firebaseConfig = {
            apiKey: "AIzaSyBrfy1R9m9kRIOyN5MWjm1Dap3XHyMxThM",
            authDomain: "auranovatd-wms.firebaseapp.com",
            databaseURL: "https://auranovatd-wms-default-rtdb.firebaseio.com",
            projectId: "auranovatd-wms",
            storageBucket: "auranovatd-wms.firebasestorage.app",
            messagingSenderId: "791367265756",
            appId: "1:791367265756:web:e09f74d00931ee9210b319",
            measurementId: "G-QFSG057YN9"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        const models = [
            "iPhone 13 / 13 Pro / 14 / 16e / 17e",
            "iPhone 15 Pro",
            "iPhone 15 Pro Max",
            "iPhone 15 / 16",
            "iPhone 16 Pro",
            "iPhone 16 Pro Max",
            "iPhone 17",
            "iPhone 17 Pro",
            "iPhone 17 Pro Max"
        ];

        const MIN_SAFETY_STOCK = 3;
        const docRef = doc(db, "wms", "inventory");
        let cachedData = null;
        let unsubscribeTransactions = null;

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById("login-screen").classList.add("hidden");
                document.getElementById("main-app").classList.remove("hidden");
                loadInventory();
                listenToTransactions();
            } else {
                document.getElementById("login-screen").classList.remove("hidden");
                document.getElementById("main-app").classList.add("hidden");
                if (unsubscribeTransactions) unsubscribeTransactions();
            }
        });

        window.loginWithFirebase = async function() {
            const email = document.getElementById("email-input").value;
            const password = document.getElementById("password-input").value;
            const errorMsg = document.getElementById("login-error");
            try {
                errorMsg.classList.add("hidden");
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) {
                errorMsg.classList.remove("hidden");
                errorMsg.innerText = "❌ Λάθος στοιχεία πρόσβασης. Δοκίμασε ξανά.";
            }
        };

        window.logoutWithFirebase = async function() {
            await signOut(auth);
        };

        async function loadInventory() {
            try {
                const docSnap = await getDoc(docRef);
                let data = {};
                if (docSnap.exists()) {
                    data = docSnap.data();
                }
                models.forEach(model => {
                    if (!data[model]) {
                        data[model] = { stock: 0, sold: 0, total_cost: 0, sold_profit: 0 };
                    }
                });
                cachedData = data;
                renderInventory(data);
            } catch (error) {
                console.error("Σφάλμα:", error);
            }
        }

        function renderInventory(data) {
            const container = document.getElementById("inventory-container");
            const alertsList = document.getElementById("alerts-list");
            const alertsContainer = document.getElementById("alerts-container");
            
            container.innerHTML = "";
            alertsList.innerHTML = "";
            let hasAlerts = false;

            models.forEach(model => {
                const stats = data[model];
                const currentStock = stats.hasOwnProperty('stock') ? parseInt(stats.stock) : 0;
                const soldCount = stats.hasOwnProperty('sold') ? parseInt(stats.sold) : 0;
                
                const calculatedTotalStock = stats.hasOwnProperty('total_stock') && !stats.hasOwnProperty('sold') 
                    ? parseInt(stats.total_stock) 
                    : (currentStock + soldCount);
                
                const netProfit = ((parseFloat(stats.sold_profit) || 0) - (parseFloat(stats.total_cost) || 0)).toFixed(2);
                const safeId = btoa(unescape(encodeURIComponent(model))).replace(/=/g, "");
                
                const isLowStock = currentStock > 0 && currentStock < MIN_SAFETY_STOCK;
                const cardBg = isLowStock ? "bg-red-50/60 border-red-200" : "bg-white";

                if (isLowStock) {
                    hasAlerts = true;
                    const li = document.createElement("li");
                    li.innerHTML = `Ξεμένεις από <b>${model}</b> (Στοκ: ${currentStock})`;
                    alertsList.appendChild(li);
                }

                const card = document.createElement("div");
                card.className = `border rounded-xl p-4 mb-4 shadow-sm transition-all ${cardBg}`;
                card.innerHTML = `
                    <div class="flex justify-between items-center mb-2">
                        <h3 class="text-base font-bold text-gray-800">📱 ${model}</h3>
                        ${isLowStock ? '<span class="text-[10px] bg-red-600 text-white px-2 py-0.5 rounded-full font-bold animate-pulse">REORDER</span>' : ''}
                    </div>
                    <div class="grid grid-cols-2 gap-2 text-xs text-gray-700 mb-3">
                        <div class="bg-gray-100/80 p-2 rounded"><b>Στοκ:</b> <span class="${isLowStock ? 'text-red-600 font-bold' : ''}">${currentStock}</span></div>
                        <div class="bg-gray-100/80 p-2 rounded"><b>Πουλήθηκαν:</b> ${soldCount}</div>
                        <div class="bg-blue-50 p-2 rounded text-blue-700 font-medium"><b>Συνολικά:</b> ${calculatedTotalStock}</div>
                        <div class="bg-gray-100/80 p-2 rounded"><b>Κέρδος:</b> <span class="${netProfit >= 0 ? 'text-green-600' : 'text-red-600'} font-medium">${netProfit}€</span></div>
                    </div>
                    
                    <div class="space-y-2 bg-gray-100/50 p-3 rounded-lg">
                        <div class="flex gap-1.5">
                            <button onclick="window.submitAction('${model}', 'restock')" class="w-1/3 bg-blue-600 text-white font-bold py-1.5 px-1 rounded-md text-[11px] active:bg-blue-800 transition-colors">🔄 Restock</button>
                            <button onclick="window.submitAction('${model}', 'sale')" class="w-1/3 bg-green-600 text-white font-bold py-1.5 px-1 rounded-md text-[11px] active:bg-green-800 transition-colors">💰 Πώληση</button>
                            <button onclick="window.submitAction('${model}', 'donation')" class="w-1/3 bg-purple-600 text-white font-bold py-1.5 px-1 rounded-md text-[11px] active:bg-purple-800 transition-colors">🎁 Δωρεά</button>
                        </div>
                        <div class="flex gap-2 text-xs">
                            <input type="number" id="qty_${safeId}" placeholder="Τεμάχια" class="w-1/2 p-1.5 border rounded-md bg-white" min="1">
                            <input type="number" id="price_${safeId}" placeholder="Ποσό (€)" class="w-1/2 p-1.5 border rounded-md bg-white" step="0.5">
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });

            if (hasAlerts) alertsContainer.classList.remove("hidden");
            else alertsContainer.classList.add("hidden");

            window.submitAction = async (model, type) => {
                const safeId = btoa(unescape(encodeURIComponent(model))).replace(/=/g, "");
                const qtyInput = document.getElementById(`qty_${safeId}`);
                const priceInput = document.getElementById(`price_${safeId}`);
                
                const qty = parseInt(qtyInput.value) || 0;
                const priceRaw = priceInput.value.trim();
                
                // 1. Έλεγχος για τα Τεμάχια
                if (qty <= 0) {
                    alert("❌ Πρέπει να δηλώσεις τουλάχιστον 1 τεμάχιο!");
                    return;
                }

                // 2. Απόλυτος έλεγχος για την Πώληση (Απαγόρευση για κενό, 0, ή αρνητικό)
                if (type === 'sale') {
                    const parsedPrice = parseFloat(priceRaw);
                    if (priceRaw === "" || isNaN(parsedPrice) || parsedPrice <= 0) {
                        alert("❌ Σφάλμα Ασφαλείας: Η τιμή πώλησης πρέπει να είναι υποχρεωτικά μεγαλύτερη από 0€! Για δωρεάν διάθεση χρησιμοποιήστε το μωβ κουμπί 'Δωρεά'.");
                        return;
                    }
                }

                // 3. Έλεγχος για το Restock (Πρέπει να έχει τιμή, αλλά επιτρέπεται το 0 για δωρεάν παραλαβές)
                if (type === 'restock') {
                    const parsedPrice = parseFloat(priceRaw);
                    if (priceRaw === "" || isNaN(parsedPrice)) {
                        alert("❌ Σφάλμα: Πρέπει να βάλετε ένα ποσό αγοράς (έστω και 0).");
                        return;
                    }
                    if (parsedPrice < 0) {
                        alert("❌ Σφάλμα: Το κόστος αγοράς δεν μπορεί να είναι αρνητικό!");
                        return;
                    }
                }

                // Μετατροπή της τελικής τιμής για τη βάση δεδομένων
                const price = type === 'donation' ? 0 : parseFloat(priceRaw);

                if (!cachedData[model].hasOwnProperty('stock')) cachedData[model].stock = 0;
                if (!cachedData[model].hasOwnProperty('sold')) cachedData[model].sold = 0;
                if (!cachedData[model].hasOwnProperty('total_cost')) cachedData[model].total_cost = 0;
                if (!cachedData[model].hasOwnProperty('sold_profit')) cachedData[model].sold_profit = 0;

                let logType = "";
                if (type === 'restock') {
                    cachedData[model].stock = parseInt(cachedData[model].stock) + qty;
                    cachedData[model].total_cost = parseFloat(cachedData[model].total_cost) + price;
                    logType = "🔄 Restock";
                } else if (type === 'sale') {
                    if (parseInt(cachedData[model].stock) < qty) {
                        alert("❌ Δεν υπάρχει αρκετό στοκ στην αποθήκη!");
                        return;
                    }
                    cachedData[model].stock = parseInt(cachedData[model].stock) - qty;
                    cachedData[model].sold = parseInt(cachedData[model].sold) + qty;
                    cachedData[model].sold_profit = parseFloat(cachedData[model].sold_profit) + price;
                    logType = "💰 Πώληση";
                } else if (type === 'donation') {
                    if (parseInt(cachedData[model].stock) < qty) {
                        alert("❌ Δεν υπάρχει αρκετό στοκ για δωρεά!");
                        return;
                    }
                    cachedData[model].stock = parseInt(cachedData[model].stock) - qty;
                    cachedData[model].sold = parseInt(cachedData[model].sold) + qty;
                    logType = "🎁 Δωρεά";
                }

                if (cachedData[model].hasOwnProperty('total_stock')) {
                    delete cachedData[model].total_stock;
                }

                await setDoc(docRef, cachedData);

                const now = new Date();
                const timeString = now.toLocaleDateString('el-GR') + " " + now.toLocaleTimeString('el-GR', {hour: '2-digit', minute:'2-digit'});
                
                await addDoc(collection(db, "transactions"), {
                    timestamp: now,
                    timeLabel: timeString,
                    type: logType,
                    model: model,
                    qty: qty,
                    price: price
                });

                qtyInput.value = "";
                priceInput.value = "";
                renderInventory(cachedData);
            };
        }

        function listenToTransactions() {
            const q = query(collection(db, "transactions"), orderBy("timestamp", "desc"), limit(5));
            unsubscribeTransactions = onSnapshot(q, (snapshot) => {
                const txContainer = document.getElementById("transactions-container");
                txContainer.innerHTML = "";
                
                if (snapshot.empty) {
                    txContainer.innerHTML = `<p class="text-gray-400 italic">Δεν υπάρχουν ακόμα καταγεγραμμένες κινήσεις.</p>`;
                    return;
                }

                snapshot.forEach((doc) => {
                    const tx = doc.data();
                    let colorClass = "text-blue-600 bg-blue-50";
                    if (tx.type.includes("Πώληση")) colorClass = "text-green-600 bg-green-50";
                    if (tx.type.includes("Δωρεά")) colorClass = "text-purple-600 bg-purple-50";
                    
                    const logRow = document.createElement("div");
                    logRow.className = `p-2 rounded border border-gray-100 flex justify-between items-center ${colorClass}`;
                    logRow.innerHTML = `
                        <div>
                            <span class="font-bold">${tx.type}</span>: ${tx.qty}x ${tx.model}
                            <div class="text-[10px] text-gray-400">${tx.timeLabel}</div>
                        </div>
                        <span class="font-semibold text-gray-700">${tx.price.toFixed(2)}€</span>
                    `;
                    txContainer.appendChild(logRow);
                });
            });
        }
    </script>
</body>
</html>
