<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuraNovaTD WMS Professional v10.3</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 font-sans p-4">

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="fixed inset-0 bg-gray-900 flex flex-col justify-center items-center z-50 px-4">
        <div class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-sm">
            <div class="text-center mb-4">
                <span class="text-4xl">🔐</span>
                <h2 class="text-xl font-bold text-gray-800 mt-2 mb-1">AuraNovaTD WMS</h2>
                <p class="text-xs text-gray-500">Σύνδεση στο επαγγελματικό σύστημα</p>
            </div>
            <div class="space-y-3">
                <input type="email" id="email-input" placeholder="Email" class="w-full p-3 border rounded-xl text-sm">
                <input type="password" id="password-input" placeholder="Password" class="w-full p-3 border rounded-xl text-sm">
            </div>
            <button onclick="window.loginWithFirebase()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl mt-6">Είσοδος</button>
            <p id="login-error" class="text-red-500 text-xs mt-3 hidden text-center"></p>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="main-app" class="hidden">
        <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6 mb-6">
            <div class="flex justify-between items-center mb-2">
                <h1 class="text-xl font-bold text-gray-800">📦 AuraNovaTD WMS</h1>
                <button onclick="window.toggleAdminPanel()" id="admin-btn" class="text-xs bg-amber-50 text-amber-700 px-2 py-1.5 rounded-lg font-bold border border-amber-200">⚙️ Διορθώσεις</button>
            </div>
            <p id="user-welcome-msg" class="text-xs text-blue-500 font-semibold mb-4"></p>
            <div id="inventory-container" class="space-y-6"></div>
        </div>

        <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6 mb-6">
            <h2 class="text-sm font-bold text-gray-800 mb-3">📜 Ιστορικό Κινήσεων</h2>
            <div id="transactions-container" class="space-y-2 text-xs"></div>
        </div>

        <div id="admin-logs-section" class="max-w-md mx-auto bg-amber-900 rounded-xl shadow-md overflow-hidden p-6 hidden">
            <h2 class="text-sm font-bold text-amber-100 mb-3">🛠️ Admin Log</h2>
            <div id="admin-transactions-container" class="space-y-2 text-xs"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, collection, addDoc, query, orderBy, limit, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBrfy1R9m9kRIOyN5MWjm1Dap3XHyMxThM",
            authDomain: "auranovatd-wms.firebaseapp.com",
            projectId: "auranovatd-wms",
            storageBucket: "auranovatd-wms.firebasestorage.app",
            messagingSenderId: "791367265756",
            appId: "1:791367265756:web:e09f74d00931ee9210b319"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const ADMIN_EMAIL = "dtsagkadakis@gmail.com";
        let isAdminAuthenticated = false;
        let cachedData = null;

        const models = ["iPhone 13 / 13 Pro / 14 / 16e / 17e", "iPhone 15 Pro", "iPhone 15 Pro Max", "iPhone 15 / 16", "iPhone 16 Pro", "iPhone 16 Pro Max", "iPhone 17", "iPhone 17 Pro", "iPhone 17 Pro Max"];

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById("login-screen").classList.add("hidden");
                document.getElementById("main-app").classList.remove("hidden");
                document.getElementById("user-welcome-msg").innerText = `Σύνδεση ως: ${user.email}`;
                loadInventory();
                listenToTransactions();
            } else {
                location.reload();
            }
        });

        window.loginWithFirebase = async () => {
            try { await signInWithEmailAndPassword(auth, document.getElementById("email-input").value, document.getElementById("password-input").value); } 
            catch { document.getElementById("login-error").classList.remove("hidden"); }
        };

        window.toggleAdminPanel = function() {
            if (!isAdminAuthenticated && auth.currentUser.email === ADMIN_EMAIL) {
                isAdminAuthenticated = true;
                document.getElementById("admin-logs-section").classList.remove("hidden");
                renderInventory(cachedData);
                listenToAdminTransactions();
            } else if (isAdminAuthenticated) {
                isAdminAuthenticated = false;
                document.getElementById("admin-logs-section").classList.add("hidden");
                renderInventory(cachedData);
            } else { alert("❌ Πρόσβαση Απαγορεύεται"); }
        };

        async function loadInventory() {
            const docSnap = await getDoc(doc(db, "wms", "inventory"));
            cachedData = docSnap.exists() ? docSnap.data() : {};
            models.forEach(m => { if(!cachedData[m]) cachedData[m] = {stock:0, sold:0, total_cost:0, sold_profit:0}; });
            renderInventory(cachedData);
        }

        function renderInventory(data) {
            const container = document.getElementById("inventory-container");
            container.innerHTML = "";
            models.forEach(model => {
                const stats = data[model];
                const safeId = btoa(unescape(encodeURIComponent(model))).replace(/=/g, "");
                const card = document.createElement("div");
                card.className = "border rounded-xl p-4 shadow-sm bg-white";
                card.innerHTML = `
                    <h3 class="font-bold text-sm mb-2">📱 ${model}</h3>
                    <div class="grid grid-cols-2 gap-2 text-xs mb-3">
                        <div class="bg-gray-100 p-2 rounded">Στοκ: ${stats.stock}</div>
                        <div class="bg-gray-100 p-2 rounded">Πουλήθηκαν: ${stats.sold}</div>
                    </div>
                    <div class="space-y-2">
                        <div class="flex gap-1">
                            <input type="number" id="qty_${safeId}" placeholder="Τεμάχια" class="w-1/3 p-1.5 border rounded text-xs">
                            <input type="number" id="price_${safeId}" placeholder="Ποσό (€)" class="w-1/3 p-1.5 border rounded text-xs">
                            <button onclick="window.submitAction('${model}', 'restock')" class="w-1/3 bg-blue-600 text-white rounded text-[10px] font-bold">➕ Αγορά</button>
                        </div>
                        <input type="text" id="ref_${safeId}" placeholder="Προμηθευτής ή Πελάτης..." class="w-full p-1.5 border rounded text-xs">
                        <div class="flex gap-2">
                            <button onclick="window.submitAction('${model}', 'sale')" class="w-1/2 bg-green-600 text-white py-1.5 rounded text-xs font-bold">💰 Πώληση</button>
                            <button onclick="window.submitAction('${model}', 'donation')" class="w-1/2 bg-purple-600 text-white py-1.5 rounded text-xs font-bold">🎁 Δωρεά</button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        window.submitAction = async (model, type) => {
            const safeId = btoa(unescape(encodeURIComponent(model))).replace(/=/g, "");
            const qty = parseInt(document.getElementById(`qty_${safeId}`).value) || 0;
            const price = parseFloat(document.getElementById(`price_${safeId}`).value) || 0;
            const ref = document.getElementById(`ref_${safeId}`).value || "Χωρίς στοιχεία";
            
            if (qty <= 0) { alert("Βάλε ποσότητα!"); return; }

            if(type === 'restock') { cachedData[model].stock += qty; cachedData[model].total_cost += price; }
            else if(type === 'sale') { cachedData[model].stock -= qty; cachedData[model].sold += qty; cachedData[model].sold_profit += price; }
            else { cachedData[model].stock -= qty; cachedData[model].sold += qty; }

            await setDoc(doc(db, "wms", "inventory"), cachedData);
            await addDoc(collection(db, "transactions"), {
                timestamp: new Date(), type, model, qty, price, reference: ref, user: auth.currentUser.email
            });
            alert("✅ Επιτυχής καταγραφή!");
            location.reload();
        };

        function listenToTransactions() {
            onSnapshot(query(collection(db, "transactions"), orderBy("timestamp", "desc"), limit(5)), (snap) => {
                const container = document.getElementById("transactions-container");
                container.innerHTML = "";
                snap.forEach(doc => {
                    const t = doc.data();
                    container.innerHTML += `<div class="p-2 border-b"><b>${t.type}</b>: ${t.qty}x ${t.model} <br><span class="text-[10px] text-gray-500">Ref: ${t.reference} | Από: ${t.user.split('@')[0]}</span></div>`;
                });
            });
        }
    </script>
</body>
</html>
