<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuraNovaTD WMS Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 font-sans p-4">

    <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6 mb-6">
        <h1 class="text-2xl font-bold text-center text-gray-800 mb-1">📦 AuraNovaTD WMS Pro</h1>
        <p class="text-xs text-center text-blue-500 font-semibold mb-4">Advanced Supply Chain System</p>
        
        <div id="alerts-container" class="hidden mb-4 p-3 bg-red-50 border border-red-200 rounded-lg text-xs text-red-700">
            <span class="font-bold">⚠️ ΠΡΟΣΟΧΗ - ΧΑΜΗΛΟ ΣΤΟΚ:</span>
            <ul id="alerts-list" class="list-disc list-inside mt-1"></ul>
        </div>

        <div id="inventory-container" class="space-y-6">
            <p class="text-center text-gray-600">Φόρτωση εξελιγμένης αποθήκης...</p>
        </div>
    </div>

    <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6">
        <h2 class="text-lg font-bold text-gray-800 mb-3 flex justify-between items-center">
            <span>📜 Ιστορικό Κινήσεων (Live Log)</span>
            <span class="text-xs font-normal text-gray-500">Τελευταίες 5 κινήσεις</span>
        </h2>
        <div id="transactions-container" class="space-y-2 text-xs">
            <p class="text-gray-500 italic">Φόρτωση ιστορικού...</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, collection, addDoc, query, orderBy, limit, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Τα κλειδιά σου
        const firebaseConfig = {
            apiKey: "AIzaSyBrfy1R9m9kRIOyN5MWjm1Dap3XHyMxThM",
            authDomain: "auranovatd-wms.firebaseapp.com",
            databaseURL: "https://auranovatd-wms-default-rtdb.firebaseio.com",
            projectId: "auranovatd-wms",
            storageBucket: "auranovatd-wms.firebasestorage.app",
            messagingSenderId: "791367265756",
            appId: "1:791367265756:web:e09f74d00931ee9210b319",
            measurementId: "G-QFSG057YN9"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const models = [
            "iPhone 13 / 13 Pro / 14 / 16e / 17e",
            "iPhone 15 Pro",
            "iPhone 15 Pro Max",
            "iPhone 15 / 16",
            "iPhone 16 Pro",
            "iPhone 16 Pro Max",
            "iPhone 17",
            "iPhone 17 Pro",
            "iPhone 17 Pro Max"
        ];

        // Σταθερό Όριο Ασφαλείας για όλα τα μοντέλα (αν πέσει κάτω από 3, χτυπάει ειδοποίηση)
        const MIN_SAFETY_STOCK = 3;

        const docRef = doc(db, "wms", "inventory");

        // Φόρτωση Δεδομένων Αποθήκης
        async function loadInventory() {
            try {
                const docSnap = await getDoc(docRef);
                let data = {};

                if (docSnap.exists()) {
                    data = docSnap.data();
                }

                models.forEach(model => {
                    if (!data[model]) {
                        data[model] = { stock: 0, sold: 0, total_cost: 0, sold_profit: 0 };
                    }
                });

                renderInventory(data);
            } catch (error) {
                console.error("Σφάλμα:", error);
            }
        }

        // Εμφάνιση της Αποθήκης και Έλεγχος Ορίων
        function renderInventory(data) {
            const container = document.getElementById("inventory-container");
            const alertsList = document.getElementById("alerts-list");
            const alertsContainer = document.getElementById("alerts-container");
            
            container.innerHTML = "";
            alertsList.innerHTML = "";
            let hasAlerts = false;

            models.forEach(model => {
                const stats = data[model];
                const calculatedTotalStock = (parseInt(stats.stock) || 0) + (parseInt(stats.sold) || 0);
                const netProfit = ((parseFloat(stats.sold_profit) || 0) - (parseFloat(stats.total_cost) || 0)).toFixed(2);
                
                const safeId = btoa(unescape(encodeURIComponent(model))).replace(/=/g, "");
                
                // Συστημικός Έλεγχος: Αν το στοκ είναι χαμηλό, κοκκινίζει η κάρτα και μπαίνει alert
                const isLowStock = stats.stock < MIN_SAFETY_STOCK;
                const cardBg = isLowStock ? "bg-red-50/60 border-red-200" : "bg-white";

                if (isLowStock) {
                    hasAlerts = true;
                    const li = document.createElement("li");
                    li.innerHTML = `Ξεμένεις από <b>${model}</b> (Στοκ: ${stats.stock})`;
                    alertsList.appendChild(li);
                }

                const card = document.createElement("div");
                card.className = `border rounded-xl p-4 mb-4 shadow-sm transition-all ${cardBg}`;
                card.innerHTML = `
                    <div class="flex justify-between items-center mb-2">
                        <h3 class="text-base font-bold text-gray-800">📱 ${model}</h3>
                        ${isLowStock ? '<span class="text-[10px] bg-red-600 text-white px-2 py-0.5 rounded-full font-bold animate-pulse">REORDER</span>' : ''}
                    </div>
                    <div class="grid grid-cols-2 gap-2 text-xs text-gray-700 mb-3">
                        <div class="bg-gray-100/80 p-2 rounded"><b>Στοκ:</b> <span class="${isLowStock ? 'text-red-600 font-bold' : ''}">${stats.stock}</span></div>
                        <div class="bg-gray-100/80 p-2 rounded"><b>Πουλήθηκαν:</b> ${stats.sold}</div>
                        <div class="bg-blue-50 p-2 rounded text-blue-700 font-medium"><b>Συνολικά:</b> ${calculatedTotalStock}</div>
                        <div class="bg-gray-100/80 p-2 rounded"><b>Κέρδος:</b> <span class="${netProfit >= 0 ? 'text-green-600' : 'text-red-600'} font-medium">${netProfit}€</span></div>
                    </div>
                    
                    <div class="space-y-2 bg-gray-100/50 p-3 rounded-lg">
                        <div class="flex gap-2">
                            <button onclick="window.submitAction('${model}', 'restock')" class="w-1/2 bg-blue-600 text-white font-bold py-1.5 px-2 rounded-lg text-xs active:bg-blue-800 transition-colors">🔄 Restock</button>
                            <button onclick="window.submitAction('${model}', 'sale')" class="w-1/2 bg-green-600 text-white font-bold py-1.5 px-2 rounded-lg text-xs active:bg-green-800 transition-colors">💰 Πώληση</button>
                        </div>
                        <div class="flex gap-2 text-xs">
                            <input type="number" id="qty_${safeId}" placeholder="Τεμάχια" class="w-1/2 p-1.5 border rounded-md bg-white" min="1">
                            <input type="number" id="price_${safeId}" placeholder="Ποσό (€)" class="w-1/2 p-1.5 border rounded-md bg-white" step="0.5">
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });

            // Εμφάνιση ή απόκρυψη του κόκκινου banner ειδοποιήσεων
            if (hasAlerts) alertsContainer.classList.remove("hidden");
            else alertsContainer.classList.add("hidden");

            // Λειτουργία κουμπιών
            window.submitAction = async (model, type) => {
                const safeId = btoa(unescape(encodeURIComponent(model))).replace(/=/g, "");
                const qtyInput = document.getElementById(`qty_${safeId}`);
                const priceInput = document.getElementById(`price_${safeId}`);
                
                const qty = parseInt(qtyInput.value) || 0;
                const price = parseFloat(priceInput.value) || 0;

                if (qty <= 0) {
                    alert("❌ Πρέπει να δηλώσεις τουλάχιστον 1 τεμάχιο!");
                    return;
                }

                let logType = "";
                if (type === 'restock') {
                    data[model].stock = (parseInt(data[model].stock) || 0) + qty;
                    data[model].total_cost = (parseFloat(data[model].total_cost) || 0) + price;
                    logType = "🔄 Restock";
                } else if (type === 'sale') {
                    if (data[model].stock < qty) {
                        alert("❌ Δεν υπάρχει αρκετό στοκ στην αποθήκη!");
                        return;
                    }
                    data[model].stock = (parseInt(data[model].stock) || 0) - qty;
                    data[model].sold = (parseInt(data[model].sold) || 0) + qty;
                    data[model].sold_profit = (parseFloat(data[model].sold_profit) || 0) + price;
                    logType = "💰 Πώληση";
                }

                // 1. Ενημέρωση Αποθήκης
                await setDoc(docRef, data);

                // 2. Αυτόματη Καταγραφή στο Ιστορικό Κινήσεων (Audit Trail)
                const now = new Date();
                const timeString = now.toLocaleDateString('el-GR') + " " + now.toLocaleTimeString('el-GR', {hour: '2-digit', minute:'2-digit'});
                
                await addDoc(collection(db, "transactions"), {
                    timestamp: now,
                    timeLabel: timeString,
                    type: logType,
                    model: model,
                    qty: qty,
                    price: price
                });

                qtyInput.value = "";
                priceInput.value = "";
                renderInventory(data);
            };
        }

        // Live Παρακολούθηση του Ιστορικού (Real-time updates)
        function listenToTransactions() {
            const q = query(collection(db, "transactions"), orderBy("timestamp", "desc"), limit(5));
            onSnapshot(q, (snapshot) => {
                const txContainer = document.getElementById("transactions-container");
                txContainer.innerHTML = "";
                
                if (snapshot.empty) {
                    txContainer.innerHTML = `<p class="text-gray-400 italic">Δεν υπάρχουν ακόμα καταγεγραμμένες κινήσεις.</p>`;
                    return;
                }

                snapshot.forEach((doc) => {
                    const tx = doc.data();
                    const colorClass = tx.type.includes("Πώληση") ? "text-green-600 bg-green-50" : "text-blue-600 bg-blue-50";
                    
                    const logRow = document.createElement("div");
                    logRow.className = `p-2 rounded border border-gray-100 flex justify-between items-center ${colorClass}`;
                    logRow.innerHTML = `
                        <div>
                            <span class="font-bold">${tx.type}</span>: ${tx.qty}x ${tx.model}
                            <div class="text-[10px] text-gray-400">${tx.timeLabel}</div>
                        </div>
                        <span class="font-semibold text-gray-700">${tx.price.toFixed(2)}€</span>
                    `;
                    txContainer.appendChild(logRow);
                });
            });
        }

        // Εκκίνηση
        loadInventory();
        listenToTransactions();
    </script>
</body>
</html>
